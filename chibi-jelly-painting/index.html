<!doctype html>
<html lang="en" data-theme="day">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#ffffff">
        <title>Chibi Jelly Painting</title>
        <meta name="description" content="Chibi Goku on his cloud, Light Yagami at his desk at night, Gojo Satoru in the void and Frieren in a field of Blue-Moon Weed flowers, painted live in the browser with three.js WebGPU + TSL, in the style of Jelly Painting.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>html{background:#ffffff}.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#ffffff;color:#6b5647;transition:opacity .45s}.loader.leaving{opacity:0}</style>
    </head>
    <body>
        <div class="loader" role="progressbar" aria-label="Mixing the paint" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="loader-study" aria-hidden="true">
                <span class="loader-ghost">Chibi Jelly Painting</span>
                <span class="loader-fill">Chibi Jelly Painting</span>
                <div class="loader-garden">
                    <svg viewBox="0 0 400 70" preserveAspectRatio="xMidYMax meet" focusable="false">
                        <defs>
                            <g id="blossom">
                                <ellipse cx="0" cy="-8.5" rx="5.6" ry="8.5"/>
                                <ellipse cx="0" cy="-8.5" rx="5.6" ry="8.5" transform="rotate(72)"/>
                                <ellipse cx="0" cy="-8.5" rx="5.6" ry="8.5" transform="rotate(144)"/>
                                <ellipse cx="0" cy="-8.5" rx="5.6" ry="8.5" transform="rotate(216)"/>
                                <ellipse cx="0" cy="-8.5" rx="5.6" ry="8.5" transform="rotate(288)"/>
                                <circle r="4.4" class="blossom-eye"/>
                            </g>
                        </defs>
                        <path class="vine-ghost" pathLength="1" d="M4 63 C60 58 90 68 150 63 S250 58 300 64 S370 60 396 63"/>
                        <path class="vine" pathLength="1" d="M4 63 C60 58 90 68 150 63 S250 58 300 64 S370 60 396 63"/>
                        <g class="flower" style="--t:.06;--ox:28px;--c:#ff8fb1;--k:1"><path class="stem" d="M28 62 Q24 48 28 36"/><g transform="translate(22 52) rotate(-28)"><ellipse class="leaf" rx="6" ry="2.6"/></g><g class="head" transform="translate(28 34) scale(1)"><use href="#blossom"/></g></g>
                        <g class="flower" style="--t:.2;--ox:80px;--c:#8fb8ff;--k:1.15"><path class="stem" d="M80 63 Q86 42 80 24"/><g transform="translate(87 48) rotate(30)"><ellipse class="leaf" rx="6.5" ry="2.7"/></g><g class="head" transform="translate(80 22) scale(1.15)"><use href="#blossom"/></g></g>
                        <g class="flower" style="--t:.34;--ox:135px;--c:#b79cff;--k:1"><path class="stem" d="M135 63 Q131 50 135 40"/><g transform="translate(141 54) rotate(25)"><ellipse class="leaf" rx="6" ry="2.6"/></g><g class="head" transform="translate(135 38)"><use href="#blossom"/></g></g>
                        <g class="flower" style="--t:.48;--ox:196px;--c:#ff9fc0;--k:1.2"><path class="stem" d="M196 63 Q190 40 196 20"/><g transform="translate(189 47) rotate(-30)"><ellipse class="leaf" rx="6.5" ry="2.7"/></g><g class="head" transform="translate(196 18) scale(1.2)"><use href="#blossom"/></g></g>
                        <g class="flower" style="--t:.62;--ox:256px;--c:#7fd6e8;--k:1"><path class="stem" d="M256 64 Q260 50 256 38"/><g transform="translate(262 55) rotate(28)"><ellipse class="leaf" rx="6" ry="2.6"/></g><g class="head" transform="translate(256 36)"><use href="#blossom"/></g></g>
                        <g class="flower" style="--t:.74;--ox:313px;--c:#ffc2d6;--k:1.1"><path class="stem" d="M313 64 Q319 46 313 26"/><g transform="translate(306 52) rotate(-26)"><ellipse class="leaf" rx="6.5" ry="2.7"/></g><g class="head" transform="translate(313 24) scale(1.1)"><use href="#blossom"/></g></g>
                        <g class="flower" style="--t:.85;--ox:368px;--c:#8fb8ff;--k:1"><path class="stem" d="M368 62 Q364 50 368 38"/><g transform="translate(374 53) rotate(26)"><ellipse class="leaf" rx="6" ry="2.6"/></g><g class="head" transform="translate(368 36)"><use href="#blossom"/></g></g>
                    </svg>
                    <div class="loader-petals">
                        <i style="--x:14%;--d:0s;--s:3.6s;--c:#ff8fb1"></i>
                        <i style="--x:30%;--d:1.4s;--s:4.2s;--c:#8fb8ff"></i>
                        <i style="--x:47%;--d:.6s;--s:3.9s;--c:#ffc2d6"></i>
                        <i style="--x:60%;--d:2.2s;--s:4.4s;--c:#b79cff"></i>
                        <i style="--x:75%;--d:.9s;--s:3.7s;--c:#7fd6e8"></i>
                        <i style="--x:90%;--d:1.9s;--s:4.1s;--c:#ff8fb1"></i>
                    </div>
                    <div class="loader-bee">
                        <svg viewBox="0 0 28 20" focusable="false">
                            <ellipse class="wing wing-a" cx="11" cy="5" rx="5" ry="3.4"/>
                            <ellipse class="wing wing-b" cx="16" cy="5.5" rx="5" ry="3.2"/>
                            <ellipse class="bee-body" cx="13" cy="12" rx="9" ry="6"/>
                            <path class="bee-stripe" d="M10 6.6v10.6M15 6.2v11.4"/>
                            <circle class="bee-body" cx="22.5" cy="11.5" r="3.4"/>
                            <circle class="bee-eye" cx="23.6" cy="10.8" r="0.9"/>
                            <path class="bee-sting" d="M4 12l-2.4.8"/>
                        </svg>
                    </div>
                </div>
            </div>
            <p class="loader-status">mixing the paint…</p>
        </div>

        <canvas class="scene" role="img" aria-label="A painting of a chibi martial-arts kid with spiky black hair and an orange gi, standing on a wobbly yellow cloud in the sky. Tap the kid to make him jump, tap the cloud to bounce it, drag to orbit and scroll to zoom."></canvas>

        <h1 class="sr-only">Chibi Jelly Painting</h1>

        <nav class="presets" aria-label="Character">
            <button type="button" class="preset" data-character="goku" aria-pressed="true">
                <canvas class="thumb" width="168" height="168"></canvas>
                <span class="preset-label">Goku</span>
            </button>
            <button type="button" class="preset" data-character="light" aria-pressed="false">
                <canvas class="thumb" width="168" height="168"></canvas>
                <span class="preset-label">Light Yagami</span>
            </button>
            <button type="button" class="preset" data-character="gojo" aria-pressed="false">
                <canvas class="thumb" width="168" height="168"></canvas>
                <span class="preset-label">Gojo Satoru</span>
            </button>
            <button type="button" class="preset" data-character="frieren" aria-pressed="false">
                <canvas class="thumb" width="168" height="168"></canvas>
                <span class="preset-label">Frieren</span>
            </button>
        </nav>

        <button type="button" class="mode" data-mode="day" data-world="sky" aria-label="Switch to dusk" title="Switch to dusk">
            <svg class="mode-icon" data-mode="day" data-world="sky" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="mode-icon" data-mode="day" data-world="room" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
            <svg class="mode-icon" data-mode="day" data-world="void" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c-1.8-2.6-3.4-4-5.2-4a4 4 0 0 0 0 8c1.8 0 3.4-1.4 5.2-4s3.4-4 5.2-4a4 4 0 0 1 0 8c-1.8 0-3.4-1.4-5.2-4z"/></svg>
            <svg class="mode-icon" data-mode="day" data-world="meadow" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M12 4.5a3 3 0 0 1 2.2 5 3 3 0 0 1 4.1 4.1 3 3 0 0 1-3.3 4.8 3 3 0 0 1-6 0 3 3 0 0 1-3.3-4.8 3 3 0 0 1 4.1-4.1A3 3 0 0 1 12 4.5z"/></svg>
            <svg class="mode-icon" data-mode="dusk" data-world="sky room" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="mode-icon" data-mode="dusk" data-world="void" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3a9 9 0 0 1 9 9M12 21a9 9 0 0 1-9-9"/></svg>
            <svg class="mode-icon" data-mode="dusk" data-world="meadow" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4l2.2 5.8L20 12l-5.8 2.2L12 20l-2.2-5.8L4 12l5.8-2.2z"/></svg>
        </button>

        <p class="hint">tap to jump · drag to turn · t day/dusk · c character</p>

        <div class="cursor" aria-hidden="true"><span></span></div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
