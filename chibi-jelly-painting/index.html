<!doctype html>
<html lang="en" data-theme="day">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#ffffff">
        <title>Chibi Jelly Painting</title>
        <meta name="description" content="A chibi martial-arts kid on a cloud, painted live in the browser with three.js WebGPU + TSL, in the style of Jelly Painting.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>html{background:#ffffff}.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#ffffff;color:#6b5647;transition:opacity .45s}.loader.leaving{opacity:0}</style>
    </head>
    <body>
        <div class="loader" role="progressbar" aria-label="Mixing the paint" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="loader-study" aria-hidden="true">
                <span class="loader-ghost">Chibi Jelly Painting</span>
                <span class="loader-fill">Chibi Jelly Painting</span>
            </div>
            <p class="loader-status">mixing the paint…</p>
        </div>

        <canvas class="scene" role="img" aria-label="A painting of a chibi martial-arts kid with spiky black hair and an orange gi, standing on a wobbly yellow cloud in the sky. Tap the kid to make him jump, tap the cloud to bounce it, drag to orbit and scroll to zoom."></canvas>

        <h1 class="sr-only">Chibi Jelly Painting</h1>

        <nav class="presets" aria-label="Time of day">
            <button type="button" class="preset" data-theme-button="day" aria-pressed="true" aria-label="Day">
                <canvas class="thumb" width="168" height="168" data-thumb="day"></canvas>
            </button>
            <button type="button" class="preset" data-theme-button="dusk" aria-pressed="false" aria-label="Dusk">
                <canvas class="thumb" width="168" height="168" data-thumb="dusk"></canvas>
            </button>
        </nav>

        <p class="hint">tap the kid to jump · drag to turn him</p>

        <div class="cursor" aria-hidden="true"><span></span></div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
